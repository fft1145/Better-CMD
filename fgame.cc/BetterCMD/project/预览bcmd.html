<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Better CMD - 傻瓜式可视化界面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .window {
    width: 1200px;
    height: 720px;
    background: #f3f3f3;
    border-radius: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 标题栏 */
  .titlebar {
    height: 34px;
    background: #ffffff;
    display: flex;
    align-items: center;
    padding: 0 14px;
    border-bottom: 1px solid #e5e5e5;
    user-select: none;
  }
  .titlebar .icon {
    width: 18px; height: 18px;
    background: linear-gradient(135deg, #2a5298, #1e3c72);
    border-radius: 4px;
    margin-right: 8px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 11px; font-weight: bold;
  }
  .titlebar .title { flex: 1; font-size: 13px; color: #333; font-weight: 500; }
  .titlebar .btns { display: flex; gap: 2px; }
  .titlebar .btns button {
    width: 34px; height: 26px;
    border: none; background: transparent;
    cursor: pointer; font-size: 14px; color: #666;
    border-radius: 4px;
  }
  .titlebar .btns button:hover { background: #e8e8e8; }
  .titlebar .btns button.close:hover { background: #e81123; color: #fff; }

  /* 主体三栏布局 */
  .main {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  /* 左侧分类导航 */
  .sidebar {
    width: 200px;
    background: #ffffff;
    border-right: 1px solid #e0e0e0;
    padding: 10px 8px;
    overflow-y: auto;
    flex-shrink: 0;
  }
  .sidebar .section-title {
    font-size: 11px;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 8px 10px 4px 10px;
    user-select: none;
  }
  .cat-btn {
    display: flex;
    align-items: center;
    padding: 10px 12px;
    font-size: 13px;
    color: #333;
    cursor: pointer;
    border-radius: 6px;
    user-select: none;
    margin-bottom: 2px;
    transition: all 0.15s;
  }
  .cat-btn:hover { background: #eef4fc; }
  .cat-btn.active {
    background: linear-gradient(135deg, #2a5298, #1e3c72);
    color: #fff;
    box-shadow: 0 2px 8px rgba(42, 82, 152, 0.3);
  }
  .cat-btn .cat-icon {
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    margin-right: 8px;
    font-size: 14px;
  }
  .cat-btn .cat-count {
    margin-left: auto;
    font-size: 11px;
    background: rgba(0,0,0,0.08);
    padding: 1px 6px;
    border-radius: 8px;
  }
  .cat-btn.active .cat-count { background: rgba(255,255,255,0.25); }

  /* 中间命令按钮网格 */
  .commands-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: #fafafa;
  }
  .commands-header {
    padding: 14px 18px 10px 18px;
    border-bottom: 1px solid #ececec;
    background: #fff;
  }
  .commands-header h2 {
    font-size: 16px;
    color: #222;
    margin-bottom: 4px;
  }
  .commands-header p {
    font-size: 12px;
    color: #888;
  }

  .commands-grid {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
    align-content: start;
  }

  .cmd-card {
    background: #fff;
    border: 1px solid #e8e8e8;
    border-radius: 8px;
    padding: 12px 14px;
    cursor: pointer;
    transition: all 0.18s;
    user-select: none;
    display: flex;
    flex-direction: column;
    gap: 4px;
    position: relative;
    overflow: hidden;
  }
  .cmd-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: linear-gradient(180deg, #2a5298, #1e3c72);
    transform: scaleY(0);
    transition: transform 0.2s;
  }
  .cmd-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.1);
    border-color: #2a5298;
  }
  .cmd-card:hover::before { transform: scaleY(1); }
  .cmd-card:active { transform: translateY(0); }

  .cmd-card .cmd-name {
    font-size: 14px;
    font-weight: 600;
    color: #2a5298;
    font-family: Consolas, monospace;
  }
  .cmd-card .cmd-desc {
    font-size: 12px;
    color: #666;
    line-height: 1.4;
  }
  .cmd-card .cmd-tag {
    font-size: 10px;
    color: #999;
    margin-top: 2px;
  }
  .cmd-card.has-params .cmd-tag::after {
    content: ' ⚙ 需要参数';
    color: #d68b00;
  }

  /* 右侧日志输出 */
  .output-panel {
    width: 380px;
    background: #0c0c0c;
    display: flex;
    flex-direction: column;
    border-left: 1px solid #1a1a1a;
    flex-shrink: 0;
  }
  .output-header {
    height: 36px;
    background: #1a1a1a;
    display: flex;
    align-items: center;
    padding: 0 12px;
    color: #aaa;
    font-size: 12px;
    border-bottom: 1px solid #262626;
  }
  .output-header .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #4ec9b0;
    margin-right: 6px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .output-header .btn-clear {
    margin-left: auto;
    background: transparent;
    border: 1px solid #444;
    color: #aaa;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 4px;
    cursor: pointer;
  }
  .output-header .btn-clear:hover { background: #2a2a2a; color: #fff; }

  .output-content {
    flex: 1;
    padding: 10px 12px;
    font-family: Consolas, "Courier New", monospace;
    font-size: 12.5px;
    line-height: 1.55;
    overflow-y: auto;
    color: #d4d4d4;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .output-content .line-cmd  { color: #4ec9b0; }
  .output-content .line-sys  { color: #858585; }
  .output-content .line-ok   { color: #6ac47d; }
  .output-content .line-err  { color: #f48771; }
  .output-content .line-info { color: #dcdcaa; }

  /* 状态栏 */
  .statusbar {
    height: 26px;
    background: #f0f0f0;
    border-top: 1px solid #e0e0e0;
    padding: 0 14px;
    font-size: 12px;
    color: #666;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  .statusbar .spacer { flex: 1; }
  .statusbar .mode-badge {
    background: #2a5298;
    color: #fff;
    padding: 1px 8px;
    border-radius: 8px;
    font-size: 10px;
  }

  /* 参数对话框 */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #fff;
    border-radius: 10px;
    width: 440px;
    max-width: 90vw;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    overflow: hidden;
  }
  .modal-header {
    padding: 14px 18px;
    background: linear-gradient(135deg, #2a5298, #1e3c72);
    color: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .modal-header .m-icon {
    width: 32px; height: 32px;
    background: rgba(255,255,255,0.15);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: Consolas, monospace;
    font-size: 14px;
    font-weight: bold;
  }
  .modal-header .m-title { font-size: 15px; font-weight: 600; }
  .modal-header .m-sub { font-size: 11px; opacity: 0.8; margin-top: 2px; }

  .modal-body {
    padding: 18px;
  }
  .form-group { margin-bottom: 14px; }
  .form-group:last-child { margin-bottom: 0; }
  .form-group label {
    display: block;
    font-size: 12px;
    color: #555;
    margin-bottom: 6px;
    font-weight: 500;
  }
  .form-group label .optional {
    color: #aaa;
    font-weight: 400;
    font-size: 11px;
    margin-left: 4px;
  }
  .form-group input,
  .form-group select {
    width: 100%;
    height: 36px;
    padding: 0 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 13px;
    font-family: Consolas, monospace;
    outline: none;
    transition: border-color 0.15s;
  }
  .form-group input:focus,
  .form-group select:focus {
    border-color: #2a5298;
    box-shadow: 0 0 0 3px rgba(42,82,152,0.1);
  }

  .modal-footer {
    padding: 12px 18px;
    background: #f8f8f8;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    border-top: 1px solid #eee;
  }
  .modal-footer button {
    height: 34px;
    padding: 0 20px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .modal-footer .btn-cancel {
    background: #e8e8e8;
    color: #333;
  }
  .modal-footer .btn-cancel:hover { background: #d8d8d8; }
  .modal-footer .btn-ok {
    background: linear-gradient(135deg, #2a5298, #1e3c72);
    color: #fff;
  }
  .modal-footer .btn-ok:hover { opacity: 0.9; }

  /* 滚动条 */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #c0c0c0; border-radius: 4px; }
  .output-content::-webkit-scrollbar-thumb { background: #333; }
</style>
</head>
<body>

<div class="window">
  <!-- 标题栏 -->
  <div class="titlebar">
    <div class="icon">B</div>
    <div class="title">Better CMD - 傻瓜式可视化界面 v5.0.0</div>
    <div class="btns">
      <button title="最小化">─</button>
      <button title="最大化">☐</button>
      <button class="close" onclick="onClose()" title="关闭">✕</button>
    </div>
  </div>

  <!-- 主体 -->
  <div class="main">
    <!-- 左侧分类 -->
    <div class="sidebar" id="sidebar"></div>

    <!-- 中间命令按钮 -->
    <div class="commands-area">
      <div class="commands-header">
        <h2 id="catTitle">文件操作</h2>
        <p id="catDesc">点击下方按钮即可执行对应功能</p>
      </div>
      <div class="commands-grid" id="cmdGrid"></div>
    </div>

    <!-- 右侧日志 -->
    <div class="output-panel">
      <div class="output-header">
        <span class="dot"></span>
        <span>操作日志</span>
        <button class="btn-clear" on
